<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <div class="sidebar">

        <h2>MovieFlix</h2>

        <ul>
            <li onclick="showSection('dashboard')">Dashboard</li>
            <li onclick="showSection('movies')">Movies</li>
            <li onclick="showSection('bookings')">Bookings</li>
            <li onclick="showSection('users')">Users</li>
        </ul>

    </div>


    <div class="main">

        <h1>Admin Dashboard</h1>

        <section id="dashboard" class="section">

            <div class="cards">

                <div class="card">
                    <h3>Total Movies</h3>
                    <p id="movieCount">0</p>
                </div>

                <div class="card">
                    <h3>Total Bookings</h3>
                    <p id="bookingCount">0</p>
                </div>

                <div class="card">
                    <h3>Total Users</h3>
                    <p id="userCount">0</p>
                </div>

            </div>

        </section>


        <section id="movies" class="section">

            <h2>Manage Movies</h2>

            <button class="add-btn" onclick="openMovieForm()">
                + Add Movie
            </button>


            <div id="movieForm" class="form-box">

                <input type="hidden" id="movieId">

                <input
                    type="text"
                    id="movieName"
                    placeholder="Movie Name"
                >

                <input
                    type="text"
                    id="movieCategory"
                    placeholder="Category"
                >

                <input
                    type="text"
                    id="movieDuration"
                    placeholder="Duration"
                >

                <input
                    type="number"
                    id="movieRating"
                    placeholder="Rating"
                    step="0.1"
                >

                <button onclick="saveMovie()">
                    Save Movie
                </button>

            </div>


            <table>

                <thead>

                    <tr>
                        <th>Movie</th>
                        <th>Category</th>
                        <th>Duration</th>
                        <th>Rating</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="movieTable">

                </tbody>

            </table>

        </section>


        <!-- Bookings -->

        <section id="bookings" class="section">

            <h2>Bookings</h2>

            <table>

                <thead>

                    <tr>
                        <th>Customer</th>
                        <th>Movie</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Tickets</th>
                    </tr>

                </thead>

                <tbody id="bookingTable">

                </tbody>

            </table>

        </section>


        <!-- Users -->

        <section id="users" class="section">

            <h2>Users</h2>

            <table>

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                    </tr>

                </thead>

                <tbody id="userTable">

                </tbody>

            </table>

        </section>

    </div>


    <script src="admin.js"></script>

</body>
</html>
