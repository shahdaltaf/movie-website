<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Movie</title>

    <link rel="stylesheet" href="booking.css">
</head>

<body>

    <!-- Navbar -->

    <header class="navbar">

        <div class="logo">
            M<span>O</span>VIE
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="categories.html">Categories</a>
            <a href="#">Movies</a>
            <a href="about.html">About</a>
            <a href="#">Contact</a>
        </nav>

        <!-- <a href="login.html" class="signin-btn">
            Sign In
        </a> -->

    </header>


    <!-- Booking Section -->

    <section class="booking-section">

        <div class="booking-container">

            <div class="booking-title">

                <p class="small-title">BOOK YOUR TICKET</p>

                <h1>
                    Reserve Your
                    <span>Movie Ticket</span>
                </h1>

                <p>
                    Choose your date, time and number of tickets
                    and enjoy your favorite movie.
                </p>

            </div>


            <!-- Booking Form -->

            <div class="booking-box">

                <h2>Movie Booking</h2>

                <p class="form-subtitle">
                    Fill in your information below
                </p>

                <form id="bookingForm">

                    <!-- Movie -->

                    <label for="movie">
                        Movie
                    </label>

                    <input
                        type="text"
                        id="movie"
                        readonly
                    >


                    <!-- Name -->

                    <label for="name">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >


                    <!-- Email -->

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <!-- Date -->

                    <label for="date">
                        Booking Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >


                    <!-- Tickets -->

                    <label for="tickets">
                        Number of Tickets
                    </label>

                    <input
                        type="number"
                        id="tickets"
                        min="1"
                        max="10"
                        placeholder="Number of tickets"
                        required
                    >


                    <!-- Showtime -->

                    <label for="time">
                        Showtime
                    </label>

                    <select id="time" required>

                        <option value="">
                            Choose a showtime
                        </option>

                        <option value="3:00 PM">
                            3:00 PM
                        </option>

                        <option value="5:00 PM">
                            5:00 PM
                        </option>

                        <option value="8:00 PM">
                            8:00 PM
                        </option>

                        <option value="10:00 PM">
                            10:00 PM
                        </option>

                    </select>


                    <button
                        type="submit"
                        class="confirm-btn"
                    >
                        Confirm Booking
                    </button>

                </form>

            </div>

        </div>

    </section>


    <!-- Booking Confirmation -->

    <div
        id="confirmation"
        class="confirmation"
    >

        <div class="confirmation-box">

            <div class="success-icon">
                ✓
            </div>

            <h2>Booking Confirmed!</h2>

            <p>
                Your movie ticket has been successfully booked.
            </p>

            <div
                id="bookingDetails"
                class="booking-details"
            >
            </div>

            <a
                href="index.html"
                class="home-btn"
            >
                Back to Home
            </a>

        </div>

    </div>


    <script src="booking.js"></script>

</body>

</html>
